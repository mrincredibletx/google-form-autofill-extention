<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Forms Auto-Fill Settings</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="icon.jpg" alt="Logo" class="logo">
      <h2>Auto-Fill Details</h2>
      <p class="subtitle">by Rakesh Bangra</p>
    </div>
    
    <div class="card">
      <p class="description">Save your common details here to have them automatically filled on Google Forms.</p>
      
      <div class="form-group">
        <label for="name">Full Name:</label>
        <input type="text" id="name" placeholder="John Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="john@example.com">
      </div>
      
      <div class="form-group">
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" placeholder="1234567890">
      </div>

      <div class="form-group">
        <label for="address">Address:</label>
        <input type="text" id="address" placeholder="123 Main St">
      </div>
      
      <button id="saveBtn">Save Details</button>
      <div id="statusMessage" class="hidden">Settings saved successfully!</div>
    </div>
    
    <div class="card">
      <div class="custom-details-section">
        <h3>Custom Details</h3>
        <p class="description">Add other custom information to auto-fill.</p>
        
        <div id="customFieldsList"></div>
        
        <div class="form-group flex-group">
          <input type="text" id="customKey" placeholder="Field (e.g., Gender)">
          <input type="text" id="customValue" placeholder="Value (e.g., Male)">
        </div>
        <button id="addCustomBtn" class="secondary">Add Custom Field</button>
      </div>
    </div>

    <div class="card completed-section">
      <h3>Completed Forms</h3>
      <p class="description">You have <span id="completedCount" class="badge">0</span> forms recorded.</p>
      <button id="clearCompletedBtn" class="danger">Clear History</button>
    </div>

    <div class="footer">
      <p>Created with &hearts; by <strong>Rakesh Bangra</strong></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
