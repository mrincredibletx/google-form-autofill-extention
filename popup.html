<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Google Forms Auto-Fill Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Auto-Fill Details</h2>
    <p>Save your common details here to have them automatically filled on Google Forms.</p>
    
    <div class="form-group">
      <label for="name">Full Name:</label>
      <input type="text" id="name" placeholder="John Doe">
    </div>
    
    <div class="form-group">
      <label for="email">Email Address:</label>
      <input type="email" id="email" placeholder="john@example.com">
    </div>
    
    <div class="form-group">
      <label for="phone">Phone Number:</label>
      <input type="tel" id="phone" placeholder="1234567890">
    </div>

    <div class="form-group">
      <label for="address">Address:</label>
      <input type="text" id="address" placeholder="123 Main St">
    </div>
    
    <button id="saveBtn">Save Details</button>
    <div id="statusMessage" class="hidden">Settings saved!</div>
    
    <hr>

    <div class="custom-details-section">
      <h3>Custom Details</h3>
      <p>Add other information to auto-fill.</p>
      
      <div id="customFieldsList"></div>
      
      <div class="form-group" style="display: flex; gap: 10px; margin-top: 10px;">
        <input type="text" id="customKey" placeholder="Field (e.g., Gender)">
        <input type="text" id="customValue" placeholder="Value (e.g., Male)">
      </div>
      <button id="addCustomBtn">Add Custom Field</button>
    </div>

    <hr>
    
    <div class="completed-section">
      <h3>Completed Forms</h3>
      <p>You have <span id="completedCount">0</span> forms recorded.</p>
      <button id="clearCompletedBtn" class="danger">Clear History</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
